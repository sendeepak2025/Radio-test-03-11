# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: radiology
  labels:
    app: backend
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-registry/radiology-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: radiology-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: radiology-config
              key: PORT
        - name: MONGO_URI
          value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@mongodb-service:27017/$(MONGO_DATABASE)?authSource=admin"
        - name: MONGO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: MONGO_ROOT_USER
        - name: MONGO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: MONGO_ROOT_PASSWORD
        - name: MONGO_DATABASE
          valueFrom:
            configMapKeyRef:
              name: radiology-config
              key: MONGO_DATABASE
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis-service:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: JWT_SECRET
        - name: ORTHANC_USERNAME
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: ORTHANC_USERNAME
        - name: ORTHANC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: radiology-secrets
              key: ORTHANC_PASSWORD
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: backend-uploads-pvc
      - name: logs
        emptyDir: {}

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: radiology
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: backend

---
# Backend PersistentVolumeClaim (for uploads)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: radiology
  labels:
    app: backend
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can write
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
